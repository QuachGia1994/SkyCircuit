<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>SkyCircuit</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">FIREWORK CIRCUIT PUZZLE</p>
          <h1>SkyCircuit</h1>
        </div>
        <div class="level-badge">LEVEL <span id="level">1</span></div>
      </header>

      <section class="hud" aria-label="Game status">
        <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
        <div class="stat"><span>ROCKETS</span><strong><span id="rockets">0</span>/<span id="target">8</span></strong></div>
        <div class="stat"><span>TIME</span><strong id="time">70</strong></div>
        <div class="stat"><span>BEST</span><strong id="best">0</strong></div>
      </section>

      <section class="game-frame">
        <canvas id="game" width="768" height="720" aria-label="SkyCircuit puzzle board"></canvas>
        <div id="overlay" class="overlay" hidden>
          <strong id="overlay-title"></strong>
          <span id="overlay-copy"></span>
        </div>
      </section>

      <p id="status" class="status" aria-live="polite">Tap a circuit tile to rotate it. Connect a spark on the left to a rocket on the right.</p>

      <nav class="controls" aria-label="Game controls">
        <button id="pause" type="button">Pause</button>
        <button id="restart" type="button" class="primary">New Game</button>
      </nav>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
