name: Native iOS V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/ios/**'
      - 'assets/icon.svg'
      - '.github/workflows/native-ios-v2.yml'

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: brew install xcodegen librsvg
      - name: Render native App Icon
        run: rsvg-convert -w 1024 -h 1024 ../../assets/icon.svg -o SkyCircuitNative/Assets.xcassets/AppIcon.appiconset/AppIcon.png
        working-directory: native/ios
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: native/ios
      - name: Build iOS 27 Simulator beta
        run: xcodebuild -project SkyCircuitNative.xcodeproj -scheme SkyCircuitNative -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -configuration Debug -derivedDataPath ../../build/native-ios CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS='$(inherited) -DSKYCIRCUIT_BETA' build
        working-directory: native/ios
      - name: Build full-access unsigned iPhone beta
        run: xcodebuild -project SkyCircuitNative.xcodeproj -scheme SkyCircuitNative -sdk iphoneos -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath ../../build/native-ios-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO OTHER_SWIFT_FLAGS='$(inherited) -DSKYCIRCUIT_BETA' build
        working-directory: native/ios
      - name: Package unsigned IPA
        run: |
          mkdir -p build/native-ios-ipa/Payload
          cp -R build/native-ios-device/Build/Products/Debug-iphoneos/SkyCircuit.app build/native-ios-ipa/Payload/
          cd build/native-ios-ipa
          zip -qry SkyCircuit-Native-V2-Beta-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SkyCircuit-Native-iOS-V2-Beta-Simulator
          path: build/native-ios/Build/Products/Debug-iphonesimulator/SkyCircuit.app
      - uses: actions/upload-artifact@v4
        with:
          name: SkyCircuit-Native-iOS-V2-Beta-Unsigned-IPA
          path: build/native-ios-ipa/SkyCircuit-Native-V2-Beta-unsigned.ipa
