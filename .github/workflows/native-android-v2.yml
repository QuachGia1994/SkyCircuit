name: Native Android V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - '.github/workflows/native-android-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android 37 SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build Native Android V2 APK
        run: gradle :app:assembleDebug
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: SkyCircuit-Native-Android-V2
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
