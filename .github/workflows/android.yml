name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - name: Remove Capacitor placeholder splash assets
        shell: bash
        run: find android/app/src/main/res -type f -name 'splash*.png' -delete
      - name: Generate branded Android icon and splash assets
        run: npx capacitor-assets generate --android --iconBackgroundColor '#07111f' --iconBackgroundColorDark '#020714' --splashBackgroundColor '#07111f' --splashBackgroundColorDark '#020714'
      - run: npx cap sync android
      - name: Verify Android splash integration
        shell: bash
        run: |
          find android/app/src/main/res -type f -name 'splash*.png' | grep -q .
          grep -R -q 'Theme.SplashScreen' android/app/src/main/res/values*
          grep -q 'SplashScreen' android/app/src/main/assets/capacitor.plugins.json
      - run: chmod +x android/gradlew
      - name: Build Android beta packages
        run: ./gradlew assembleRelease assembleDebug
        working-directory: android
      - name: Stage beta packages
        shell: bash
        run: |
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/android/SkyCircuit-Beta-Unsigned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/android/SkyCircuit-Beta-Installable.apk
      - name: Verify installable beta signature
        shell: bash
        run: |
          APK="artifacts/android/SkyCircuit-Beta-Installable.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -f "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: SkyCircuit-Beta-Installable-APK
          path: artifacts/android/SkyCircuit-Beta-Installable.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SkyCircuit-Beta-Unsigned-APK
          path: artifacts/android/SkyCircuit-Beta-Unsigned.apk
